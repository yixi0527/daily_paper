name: Daily Pages Sync

"on":
  push:
    branches:
      - main
  schedule:
    # 17:23 UTC = 01:23 Asia/Shanghai (next day). The off-hour minute reduces queue delay.
    - cron: "23 17 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DATABASE_URL: sqlite:///./data/pages.db
      VITE_APP_MODE: static
      APP_DEBUG: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: |
          python -m pip install -e .
          npm ci

      - name: Prepare database and seed
        run: |
          mkdir -p data
          python scripts/run_alembic.py upgrade head
          python -m app.cli seed-journals

      - name: Run synchronization
        run: python -m app.cli sync --all --triggered-by github-pages --require-complete

      - name: Export static data
        run: |
          python -m app.cli export-static \
            --output apps/web/public/data \
            --source-revision "${GITHUB_SHA}" \
            --source-event "${GITHUB_EVENT_NAME}" \
            --workflow-run-id "${GITHUB_RUN_ID}"

      - name: Build static site
        env:
          VITE_GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/
          VITE_STATIC_DATA_BASE: /${{ github.event.repository.name }}/data
        run: npm --workspace apps/web run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
